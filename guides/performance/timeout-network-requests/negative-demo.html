<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Request Demo</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
            color: #222;
        }
        .container {
            border: 1px solid #ccc;
            padding: 20px;
            border-radius: 8px;
            max-width: 600px;
        }
        button {
            padding: 10px 20px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        #result {
            margin-top: 20px;
            padding: 10px;
            background: #eee;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>API Request Handler</h1>
        <p>Trigger a network request with a 2-second limit.</p>
        <button id="fetch-btn">Start Request</button>
        <div id="result">Waiting...</div>
    </div>

    <script>
        const btn = document.getElementById('fetch-btn');
        const output = document.getElementById('result');

        btn.addEventListener('click', async () => {
            btn.disabled = true;
            output.textContent = 'Loading...';

            const controller = new AbortController();
            const timeoutId = setTimeout(() => {
                controller.abort();
            }, 2000);

            try {
                const response = await fetch('https://httpbin.org/delay/5', {
                    signal: controller.signal
                });
                const data = await response.json();
                output.textContent = JSON.stringify(data);
            } catch (e) {
                if (e.name === 'AbortError') {
                    output.textContent = 'Error: The operation timed out.';
                } else {
                    output.textContent = 'Error: ' + e.message;
                }
            } finally {
                clearTimeout(timeoutId);
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
