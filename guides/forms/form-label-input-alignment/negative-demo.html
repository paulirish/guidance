<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Layout</title>
    <style>
        :root {
            --font-family: Arial, sans-serif;
            --spacing: 15px;
        }

        body {
            font-family: var(--font-family);
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }

        .form-container {
            border: 1px solid #ccc;
            padding: 20px;
            border-radius: 4px;
        }

        .form-row {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
            padding: 10px;
            background: #f4f4f4;
        }

        label {
            width: 150px;
            font-weight: bold;
            margin-right: 10px;
        }

        input {
            flex: 1;
            padding: 8px;
            border: 1px solid #999;
            border-radius: 3px;
        }

        .footer {
            margin-top: 20px;
            font-size: 0.9em;
            color: #555;
        }
    </style>
</head>
<body>

    <h1>Contact Information</h1>
    
    <div class="form-container">
        <div class="form-row">
            <label for="name">Full Name</label>
            <input type="text" id="name" placeholder="John Doe">
        </div>

        <div class="form-row">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="john@example.com">
        </div>

        <div class="form-row">
            <label for="subject">Message Subject</label>
            <input type="text" id="subject" placeholder="Inquiry">
        </div>
    </div>

    <div class="footer">
        Standard flexbox layout implementation.
    </div>

</body>
</html>
